        button {

      }

    display: block;
    margin: auto;
}

    text-decoration: none;
}

</head>
<body>
    <h1>BPM Tapper</h1>

    <button class="butt">Click Me</button>
    <br />
    <a href="index.html"><button class="butt">Home</button></a>
    <br />
    <a href ="drumset.html"><button class="butt">Drumset</button></a>
   

    
    
    <script>
       // Step 1: Search and grab the element you want a change
    let button = document.querySelector("button");
    button.addEventListener("click", getBPM);

    let clicks = [];

    function getBPM() {
    // Step 2: Make the change
    const timeRightNow = Date.now();
    clicks.push(timeRightNow);

        if (clicks.length >=10) {
           let totalInterval = 0
            //calculate the bpm
            for (let i = 1; i < clicks.length; i++) {
                totalInterval += clicks[i] - clicks[i-1];
            }
            const AverageInterval = totalInterval / (clicks.length - 1);
            const bpm = Math.round(convert(AverageInterval));
            alert("The BPM is: " + bpm);
            clicks = [];
        }else {
            console.log("There's not enough clicks yet to calculate.");
        }
    }

    function convert(time) {
        return 60 / (time / 1000);
    }

    </script>
</body>
